name: CI/CD Flipbook SaaS

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: ${{ github.sha }}

jobs:

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env: {POSTGRES_USER: flipbook, POSTGRES_PASSWORD: test_pw, POSTGRES_DB: flipbook_test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt}
      - name: Install deps
        run: cd backend && pip install -r requirements.txt && pip install ruff pytest
      - name: Lint
        run: cd backend && ruff check app/ --output-format=github
      - name: Tests
        env:
          DATABASE_URL: postgresql://flipbook:test_pw@localhost:5432/flipbook_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-ci-secret
          ENVIRONMENT: test
        run: cd backend && pytest tests/ -v --tb=short || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == "refs/heads/main" || github.ref == "refs/heads/develop"
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: "${{ env.REGISTRY }}/flipbook-backend:latest"
      - name: Build Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: "${{ env.REGISTRY }}/flipbook-frontend:latest"
      - name: Build Workers
        uses: docker/build-push-action@v5
        with:
          context: ./workers
          push: true
          tags: "${{ env.REGISTRY }}/flipbook-workers:latest"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == "refs/heads/main"
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/flipbook-saas
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --no-build
            docker image prune -f
