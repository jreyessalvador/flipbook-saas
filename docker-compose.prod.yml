# ------------------------------------------------------------------------
# PRODUCCION Cetrix Revistas -- https://revistas.cetrix.com.mx (Contabo 1)
# Carpeta: /srv/apps/flipbook  ·  proyecto: flipbook-prod  ·  datos en ./data/
# Puertos reservados en /srv/apps/PORTS.md, todos en 127.0.0.1 (nginx publica):
#   web 3400 · api 4400 · postgres 5443 · redis 6390 · minio 9012/9013
# Sin bind-mount del codigo: la imagen lleva el codigo del commit desplegado.
# Actualizar: git pull --ff-only && docker compose -p flipbook-prod -f docker-compose.prod.yml up -d --build
# PROHIBIDO en este host: docker system prune / volume prune / compose down -v.
# ------------------------------------------------------------------------
name: flipbook-prod

x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  PDF_QUEUE_URL: redis://pdf-queue:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_SECURE: "False"
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  CORS_ORIGINS: ${CORS_ORIGINS}
  DEBUG: "False"
  # L9 correo (valores en .env; SMTP_PASSWORD nunca en el repo)
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  MAIL_FROM: ${MAIL_FROM:-}
  MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
  MAIL_DRY_RUN: ${MAIL_DRY_RUN:-false}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}

services:
  postgresql:
    image: postgres:15-alpine
    container_name: flipbook-prod-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5443:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./backend/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: flipbook-prod-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6390:6379"
    volumes:
      - ./data/redis:/data
    mem_limit: 256m
    restart: unless-stopped

  pdf-queue:
    image: redis:7-alpine
    container_name: flipbook-prod-pdf-queue
    mem_limit: 128m
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: flipbook-prod-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9012:9000"
      - "127.0.0.1:9013:9001"
    volumes:
      - ./data/minio:/data
    mem_limit: 1g
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: flipbook-prod-backend:latest
    container_name: flipbook-prod-backend
    environment: *backend-env
    ports:
      - "127.0.0.1:4400:8000"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips=*
    cpus: 2
    mem_limit: 1536m
    restart: unless-stopped

  pdf-worker:
    image: flipbook-prod-backend:latest
    container_name: flipbook-prod-pdf-worker
    environment: *backend-env
    depends_on:
      - backend
    command: celery -A app.workers.celery_app.celery_app worker -B --schedule /tmp/celerybeat-schedule --loglevel=INFO --concurrency=1
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    cpus: 1.5
    mem_limit: 1536m
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    image: flipbook-prod-frontend:latest
    container_name: flipbook-prod-frontend
    ports:
      - "127.0.0.1:3400:80"
    depends_on:
      - backend
    mem_limit: 128m
    restart: unless-stopped
