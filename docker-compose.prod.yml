# docker-compose.prod.yml -- PRODUCCION
version: '3.9'

x-logging: &logging
  driver: json-file
  options: {max-size: 20m, max-file: '5'}

x-restart: &restart
  restart: unless-stopped

x-env: &env
  env_file: [./.env.prod]

services:

  postgres:
    image: postgres:15-alpine
    container_name: flipbook-postgres
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose: ["5432"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U flipbook]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: flipbook-redis
    <<: *restart
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes: [redis_data:/data]
    expose: ["6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: flipbook-minio
    <<: *restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/data]
    expose: ["9000","9001"]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *logging

  backend:
    image: ${REGISTRY}/flipbook-backend:${IMAGE_TAG:-latest}
    container_name: flipbook-backend
    <<: *restart
    <<: *env
    expose: ["8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logging

  celery_worker:
    image: ${REGISTRY}/flipbook-workers:${IMAGE_TAG:-latest}
    container_name: flipbook-celery-worker
    <<: *restart
    <<: *env
    command: celery -A celery_app worker --loglevel=info --concurrency=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

  celery_beat:
    image: ${REGISTRY}/flipbook-workers:${IMAGE_TAG:-latest}
    container_name: flipbook-celery-beat
    <<: *restart
    <<: *env
    command: celery -A celery_app beat --loglevel=info
    depends_on: [redis]
    logging: *logging

  frontend:
    image: ${REGISTRY}/flipbook-frontend:${IMAGE_TAG:-latest}
    container_name: flipbook-frontend
    <<: *restart
    expose: ["80"]
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging

volumes:
  postgres_data:
    name: flipbook_prod_postgres
  redis_data:
    name: flipbook_prod_redis
  minio_data:
    name: flipbook_prod_minio

networks:
  default:
    name: flipbook-prod-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
