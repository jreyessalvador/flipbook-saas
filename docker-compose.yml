# =============================================================================
# docker-compose.yml — Entorno DESARROLLO local
# =============================================================================
# Uso: docker compose up -d
# Produccion: docker compose -f docker-compose.prod.yml up -d
version: '3.9'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  postgres:
    image: postgres:15-alpine
    container_name: flipbook-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: flipbook
      POSTGRES_PASSWORD: dev_password_local
      POSTGRES_DB: flipbook
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./deploy/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flipbook -d flipbook"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: flipbook-redis-dev
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6381:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  minio:
    image: minio/minio:latest
    container_name: flipbook-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: flipbook_admin
      MINIO_ROOT_PASSWORD: dev_minio_s3_password
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: flipbook-backend-dev
    restart: unless-stopped
    env_file:
      - ./backend/.env.dev
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging

  celery_worker:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: flipbook-celery-dev
    restart: unless-stopped
    env_file:
      - ./backend/.env.dev
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./workers:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  celery_beat:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: flipbook-celery-beat-dev
    restart: unless-stopped
    env_file:
      - ./backend/.env.dev
    command: celery -A celery_app beat --loglevel=info
    volumes:
      - ./workers:/app
    depends_on:
      - redis
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: flipbook-frontend-dev
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8001
    ports:
      - "5174:5173"
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    depends_on:
      - backend
    logging: *default-logging

volumes:
  postgres_dev_data:
    name: flipbook_dev_postgres
  redis_dev_data:
    name: flipbook_dev_redis
  minio_dev_data:
    name: flipbook_dev_minio

networks:
  default:
    name: flipbook-dev-net
    driver: bridge
