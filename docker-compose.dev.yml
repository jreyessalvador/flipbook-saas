
# ------------------------------------------------------------------------
# Stack de desarrollo/pruebas visuales -- ver RECETA-DESARROLLO.md seccion 4
# y "Incidente de infraestructura" en seccion 9 (Lote 3, 12-sep-2026).
#
# Este archivo YA REFLEJA la configuracion real usada en ia-lavatur:
# nombres de contenedor flipbook-dev-*, datos persistidos en ./data/ (NO
# volumenes nombrados de Docker, para que "mover de servidor" sea copiar
# esta carpeta), y todo valor especifico del entorno (credenciales,
# puertos/IP publicados) en .env -- ver .env.example para la lista
# completa de variables que hay que definir.
#
# IMPORTANTE -- antes de correr `docker compose -f docker-compose.dev.yml up`
# contra un stack que ya esta corriendo (por ejemplo para reiniciar solo el
# backend tras un cambio de codigo), verificar primero con
# `docker inspect <contenedor> --format '{{json .Mounts}}'` que la
# configuracion real coincide con este archivo. Si no coincide (p.ej. el
# contenedor no tiene el bind-mount que este archivo declara), NO usar
# `docker compose up`/`--force-recreate`: usar en su lugar
# `docker restart <contenedor>` o `docker cp <archivo> <contenedor>:<ruta>`
# + `docker restart`. Un `docker compose up` contra un archivo desincronizado
# puede RECREAR el contenedor con otro nombre/config y dejar huerfano (o
# borrar) el real -- ya paso una vez, ver la seccion 9 mencionada arriba.
# ------------------------------------------------------------------------

services:
  postgresql:
    image: postgres:15-alpine
    container_name: flipbook-dev-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5442}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./backend/migrations:/migrations:ro
    mem_limit: ${POSTGRES_MEM:-768m}
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: flipbook-dev-redis
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6389}:6379"
    volumes:
      - ./data/redis:/data
    mem_limit: ${REDIS_MEM:-256m}
    restart: unless-stopped

  pdf-queue:
    image: redis:7-alpine
    container_name: flipbook-dev-pdf-queue
    mem_limit: ${PDF_QUEUE_MEM:-128m}
    restart: unless-stopped

  minio:
    # quay.io/minio ya no sirve imagenes publicas (401). Version fijada, la misma
    # que usan los demas stacks de Contabo 1; sobreescribible con MINIO_IMAGE.
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    container_name: flipbook-dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9010}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9011}:9001"
    volumes:
      - ./data/minio:/data
    mem_limit: ${MINIO_MEM:-768m}
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flipbook-dev-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      PDF_QUEUE_URL: redis://pdf-queue:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "False"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEBUG: "True"
    ports:
      - "${API_PORT}:8000"
    depends_on:
      - postgresql
      - redis
      - minio
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    cpus: ${BACKEND_CPUS:-1.5}
    mem_limit: ${BACKEND_MEM:-1g}
    restart: unless-stopped

  pdf-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flipbook-dev-pdf-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      PDF_QUEUE_URL: redis://pdf-queue:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "False"
    depends_on:
      - postgresql
      - redis
      - minio
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --concurrency=1
    # El Dockerfile del backend define un HEALTHCHECK contra :8000 que el
    # worker no sirve (falso "unhealthy" en ia-lavatur desde el 14-sep).
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    # Limites: en Contabo 1 comparte host con stacks productivos.
    cpus: ${PDF_WORKER_CPUS:-1.5}
    mem_limit: ${PDF_WORKER_MEM:-1536m}
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: flipbook-dev-frontend
    working_dir: /app
    environment:
      VITE_API_URL: ${VITE_API_URL}
      # Detras de un reverse proxy (Contabo 1): Vite >=5.4.12 rechaza Host
      # desconocidos; y el HMR debe conectar por el puerto publico (443).
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
      VITE_HMR_CLIENT_PORT: ${VITE_HMR_CLIENT_PORT:-}
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    cpus: ${FRONTEND_CPUS:-1.0}
    mem_limit: ${FRONTEND_MEM:-1g}
    restart: unless-stopped
