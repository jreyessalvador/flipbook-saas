# Lote F (2026-10-04): worker de render de flipbook-saas en Contabo 2.
# Aislamiento (RECETA §24): usuario 997 sin sudo, red flipbook-worker-net con
# cortafuegos flipbook-worker-fw.service (solo gateway del tunel), sin
# capacidades, raiz de solo lectura, limites de CPU/RAM/PIDs.
x-worker: &worker
  image: flipbook-render-worker:f1
  user: "997:986"
  read_only: true
  tmpfs:
    - /tmp:rw,size=768m
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 2g
  cpus: 2
  pids_limit: 512
  shm_size: 512m
  networks: [flipbook-worker-net]
  volumes:
    - /srv/flipbook-worker/app:/app:ro
  command: ["python", "/app/worker.py"]
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/heartbeat')<180 else 1)\""]
    interval: 60s
    timeout: 10s
    retries: 3
    start_period: 30s
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  render-dev:
    <<: *worker
    container_name: flipbook-render-dev
    environment:
      GATEWAY: http://10.253.43.1:8462
      PUBLIC_ORIGIN: https://dev-revistas.cetrix.com.mx
      HOME: /tmp
    env_file: [/srv/flipbook-worker/dev.env]

networks:
  flipbook-worker-net:
    external: true
