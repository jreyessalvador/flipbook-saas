# nginx interno del contenedor flipbook-prod-frontend (SPA estatica).
# El nginx del host (revistas.cetrix.com.mx) hace TLS, /api y las reglas Open Graph.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/manifest+json image/svg+xml;

    # Ficheros con hash de Vite: cache larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?|mp3|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Lote L4: version insertable del lector (iframe en webs de clientes).
    # Unica ruta que se puede enmarcar desde cualquier dominio.
    location /embed/ {
        add_header Cache-Control "no-cache";
        # Lote SEC-2: CSP completa (script-src 'self').
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self' https:; child-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors *" always;
        # "=404" al final: /index.html se sirve DENTRO de esta location. Sin el,
        # el ultimo argumento de try_files hace una redireccion interna a
        # location / y la cabecera acaba siendo frame-ancestors 'self'.
        try_files /index.html =404;
    }

    # SPA: index.html sin cache para que cada despliegue se vea al momento.
    # Lote L4: el panel y el lector normal solo se pueden enmarcar desde el
    # propio sitio (antes cualquiera podia -> riesgo de clickjacking).
    location / {
        add_header Cache-Control "no-cache";
        # Lote SEC-2: CSP completa (script-src 'self').
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self' https:; child-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
