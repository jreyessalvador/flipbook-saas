# nginx interno del contenedor flipbook-prod-frontend (SPA estatica).
# El nginx del host (revistas.cetrix.com.mx) hace TLS, /api y las reglas Open Graph.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/manifest+json image/svg+xml;

    # Ficheros con hash de Vite: cache larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?|mp3|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA: index.html sin cache para que cada despliegue se vea al momento
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
